<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1000" viewBox="0 0 1640 1000"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arw" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
      <path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#4a5568"/>
    </marker>
    <marker id="arwMuted" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
      <path d="M0,0.6 L7.4,4 L0,7.4 z" fill="#7a6a99"/>
    </marker>
    <style>
      .stage   { font-size:10.5px; letter-spacing:1.6px; fill:#7b8494; font-weight:700 }
      .h       { font-size:16px; font-weight:700; fill:#14181f }
      .b       { font-size:12.5px; fill:#4d5663 }
      .note    { font-size:11.5px; fill:#6b7280; font-style:italic }
      .zone    { font-size:11px; letter-spacing:2.2px; font-weight:700 }
      .cap     { font-family:Georgia, 'Times New Roman', serif; font-size:12.5px; fill:#5b6472 }
      .ttl     { font-family:Georgia, 'Times New Roman', serif; font-size:23px; fill:#14181f }
      .sub     { font-family:Georgia, 'Times New Roman', serif; font-size:13.5px; fill:#5b6472; font-style:italic }
    </style>
  </defs>

  <rect width="1640" height="1000" fill="#ffffff"/>

  <text class="ttl" x="56" y="46">Return-Risk Scorer for Cash-on-Delivery Orders</text>
  <text class="sub" x="56" y="70">Pipeline from grounded synthetic data to a served, explained decision</text>

  <!-- ══════════════ BUILD-TIME ZONE ══════════════ -->
  <rect x="34" y="96" width="1572" height="452" rx="4" fill="#fafaf8" stroke="#e4e4de" stroke-width="1"/>
  <text class="zone" x="56" y="122" fill="#8a7f5f">BUILD TIME — RUN ONCE, OFFLINE</text>

  <!-- stage columns -->
  <g>
    <!-- 1 Data generation -->
    <text class="stage" x="56" y="152">1 · DATA GENERATION</text>
    <rect x="56" y="164" width="280" height="132" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="1.4"/>
    <text class="h" x="76" y="196">Synthetic orders</text>
    <text class="b" x="76" y="220">50,000 orders placed on the</text>
    <text class="b" x="76" y="239">real India Post pincode map,</text>
    <text class="b" x="76" y="258">labels drawn from grounded</text>
    <text class="b" x="76" y="277">return-rate drivers</text>
    <text class="note" x="56" y="318">Calibrated to published Indian</text>
    <text class="note" x="56" y="335">rates, enforced by assertion</text>

    <!-- 2 Feature engineering -->
    <text class="stage" x="368" y="152">2 · FEATURE ENGINEERING</text>
    <rect x="368" y="164" width="280" height="132" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="1.4"/>
    <text class="h" x="388" y="196">Feature matrix</text>
    <text class="b" x="388" y="220">Address quality, customer</text>
    <text class="b" x="388" y="239">history, courier ETA, basket,</text>
    <text class="b" x="388" y="258">and out-of-fold target</text>
    <text class="b" x="388" y="277">encoding of pincode risk</text>
    <text class="note" x="368" y="318">32 features · naive encoding</text>
    <text class="note" x="368" y="335">would inflate AUC by 0.17</text>

    <!-- 3 Model selection -->
    <text class="stage" x="680" y="152">3 · MODEL SELECTION</text>
    <rect x="680" y="164" width="280" height="132" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="1.4"/>
    <text class="h" x="700" y="196">Benchmark</text>
    <text class="b" x="700" y="220">11 estimators on identical</text>
    <text class="b" x="700" y="239">expanding time folds, ranked</text>
    <text class="b" x="700" y="258">on PR-AUC with a paired</text>
    <text class="b" x="700" y="277">bootstrap between them</text>
    <text class="note" x="680" y="318">Logistic-regression baseline</text>
    <text class="note" x="680" y="335">unbeaten by any of the ten</text>

    <!-- 4 Hyperparameter tuning -->
    <text class="stage" x="992" y="152">4 · HYPERPARAMETER TUNING</text>
    <rect x="992" y="164" width="280" height="132" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="1.4"/>
    <text class="h" x="1012" y="196">Optuna vs FLAML</text>
    <text class="b" x="1012" y="220">Multivariate TPE with</text>
    <text class="b" x="1012" y="239">Hyperband pruning, against</text>
    <text class="b" x="1012" y="258">cost-frugal BlendSearch, on</text>
    <text class="b" x="1012" y="277">one shared search space</text>
    <text class="note" x="992" y="318">Equal 300 s wall-clock budget ·</text>
    <text class="note" x="992" y="335">gain did not transfer out of sample</text>

    <!-- 5 Evaluation -->
    <text class="stage" x="1304" y="152">5 · EVALUATION</text>
    <rect x="1304" y="164" width="280" height="132" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="1.4"/>
    <text class="h" x="1324" y="196">Held-out test</text>
    <text class="b" x="1324" y="220">Opened once, at a threshold</text>
    <text class="b" x="1324" y="239">and tier cut-offs already</text>
    <text class="b" x="1324" y="258">frozen on validation at the</text>
    <text class="b" x="1324" y="277">rupee cost minimum</text>
    <text class="note" x="1304" y="318">Prevalence swept 18–35% ·</text>
    <text class="note" x="1304" y="335">calibration drift quantified</text>
  </g>

  <!-- horizontal chain -->
  <line x1="336" y1="230" x2="361" y2="230" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="648" y1="230" x2="673" y2="230" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="960" y1="230" x2="985" y2="230" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="1272" y1="230" x2="1297" y2="230" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- artifact -->
  <rect x="1304" y="392" width="280" height="76" rx="3" fill="#fdfaf2" stroke="#8a6d3b" stroke-width="1.6"/>
  <text class="h" x="1324" y="420" fill="#5c4a28">Model artifact</text>
  <text class="b" x="1324" y="443" fill="#6b5a3c">Fitted pipeline with its frozen</text>
  <text class="b" x="1324" y="459" fill="#6b5a3c">threshold and tier cut-offs</text>
  <line x1="1444" y1="352" x2="1444" y2="387" stroke="#8a6d3b" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- boundary between build and serving -->
  <line x1="34" y1="574" x2="1606" y2="574" stroke="#b9bec7" stroke-width="1.3" stroke-dasharray="7 5"/>

  <!-- ══════════════ SERVING-TIME ZONE ══════════════ -->
  <rect x="34" y="600" width="1572" height="330" rx="4" fill="#f6f8fa" stroke="#e1e6ec" stroke-width="1"/>
  <text class="zone" x="56" y="626" fill="#5b7189">SERVING TIME — RUN PER REQUEST</text>

  <text class="stage" x="1304" y="656">8 · SCORING SERVICE</text>
  <rect x="1304" y="668" width="280" height="118" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="1.4"/>
  <text class="h" x="1324" y="700">Scorer</text>
  <text class="b" x="1324" y="723">Loads the artifact once, then</text>
  <text class="b" x="1324" y="742">returns risk, rupee loss, tier</text>
  <text class="b" x="1324" y="761">and SHAP-derived reasons</text>

  <text class="stage" x="992" y="656">9 · HTTP API</text>
  <rect x="992" y="668" width="280" height="118" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="1.4"/>
  <text class="h" x="1012" y="700">Web service</text>
  <text class="b" x="1012" y="723">Validates one order and</text>
  <text class="b" x="1012" y="742">scores it. Serves /score,</text>
  <text class="b" x="1012" y="761">/health and /sample_orders</text>

  <text class="stage" x="680" y="656">10 · INTERFACE</text>
  <rect x="680" y="668" width="280" height="118" rx="3" fill="#ffffff" stroke="#4a5568" stroke-width="1.4"/>
  <text class="h" x="700" y="700">Merchant page</text>
  <text class="b" x="700" y="723">One screen showing risk,</text>
  <text class="b" x="700" y="742">expected loss, the decision</text>
  <text class="b" x="700" y="761">and the reasons behind it</text>

  <!-- artifact into scorer -->
  <line x1="1544" y1="472" x2="1544" y2="663" stroke="#8a6d3b" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="1304" y1="727" x2="1277" y2="727" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arw)"/>
  <line x1="992"  y1="727" x2="965"  y2="727" stroke="#4a5568" stroke-width="1.6" marker-end="url(#arw)"/>

  <!-- Gemini side branch -->
  <text class="stage" x="368" y="656" fill="#8579a6">SIDE BRANCH</text>
  <rect x="368" y="668" width="280" height="118" rx="3" fill="#faf8fd" stroke="#7a6a99" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text class="h" x="388" y="700" fill="#4b4160">Plain-English layer</text>
  <text class="b" x="388" y="723" fill="#5d5375">Gemini rewrites the result for</text>
  <text class="b" x="388" y="742" fill="#5d5375">a non-technical reader. Falls</text>
  <text class="b" x="388" y="761" fill="#5d5375">back to a template on failure</text>
  <path d="M1444,786 L1444,846 L508,846 L508,791" fill="none" stroke="#7a6a99" stroke-width="1.4"
        stroke-dasharray="5 3" marker-end="url(#arwMuted)"/>
  <line x1="648" y1="727" x2="675" y2="727" stroke="#7a6a99" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arwMuted)"/>

  <!-- legend -->
  <g transform="translate(56,876)">
    <rect x="0" y="0" width="26" height="11" fill="#fafaf8" stroke="#c9c9c0" stroke-width="1"/>
    <text class="b" x="34" y="10" font-size="11.5">Build time, offline</text>
    <rect x="176" y="0" width="26" height="11" fill="#f6f8fa" stroke="#c6cfd8" stroke-width="1"/>
    <text class="b" x="210" y="10" font-size="11.5">Serving time, per request</text>
    <line x1="392" y1="6" x2="424" y2="6" stroke="#7a6a99" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text class="b" x="432" y="10" font-size="11.5">Optional, degrades gracefully</text>
    <line x1="644" y1="6" x2="676" y2="6" stroke="#8a6d3b" stroke-width="1.6"/>
    <text class="b" x="684" y="10" font-size="11.5">Frozen artifact boundary</text>
  </g>

  <text class="cap" x="56" y="960">Figure 1. Nothing at serving time can alter the model or its decision cut-offs. The test set is read once, at</text>
  <text class="cap" x="56" y="980">stage 5, after the operating point has already been fixed on validation.</text>
</svg>
